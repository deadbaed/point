[bar]
order = [ "default", "additional-info" ]

    [bar.additional-info]
    center = []
    enabled = true
    end = [ "bar", "airpods", "widget", "lock_keys", "privacy" ]
    margin_ends = 0
    position = "bottom"
    radius = 0
    start = [ "cpu", "temp", "ram", "gpu", "vram", "sysmon", "network_rx", "network_tx" ]
    widget_spacing = 24

    [bar.default]
    background_opacity = 0.80
    center = []
    end = [
        "media",
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "recorder",
        "keyboard_layout",
        "control-center",
        "session"
    ]
    start = [ "workspaces", "clock", "active_window" ]
    widget_spacing = 12

[calendar]
enabled = true

[control_center]
sidebar = "none"
sidebar_section = "full"
width = 1000

    [control_center.calendar]
    show_week_numbers = true

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.0
transition_duration = 1000

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box", "lockscreen-widget-0000000000000001", "lockscreen-widget-0000000000000002" ]

    [lockscreen_widgets.grid]
    cell_size = 64
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1138.0
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = true
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 192.0
    box_width = 576.0
    cx = 1280.0
    cy = 720.0
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        center_text = true
        format = "{:%H:%M:%S}"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 0.0
    box_width = 0.0
    cx = 1280.0
    cy = 464.0
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "sticker"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = true
        image_path = "/home/phil/.face"
        opacity = 1.0

[nightlight]
enabled = true

[plugin_settings."noctalia/screen_recorder"]
audio_source = "none"

[plugins]
enabled = [
    "noctalia/screen_recorder",
    "harveywuk/airpods",
    "raycursive/niri-displays",
    "yocraft/qrcode",
    "elijaharch/wl-screen-mirror",
    "andrewdems/vpn-manager"
]

[shell]
date_format = "%A, %F"
font_family = "Adwaita Sans"
password_style = "random"
screen_time_enabled = true
settings_expand_all_groups = true
time_format = "{:%H:%M:%S}"

    [shell.launcher]
    compact = true
    search_position = "top"
    show_app_actions = true

    [shell.panel]
    open_near_click_control_center = true
    open_near_click_session = true

    [shell.session]
    show_shortcuts = false

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        variant = "default"

        [[shell.session.actions]]
        action = "reboot_uefi"
        command = "notify-send 'Noctalia' 'Custom session entry'"
        countdown_seconds = 0.0
        enabled = true
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        variant = "destructive"

[theme]
community_palette = "Catppuccin Macchiato Blue"
mode = "auto"
pure_black_dark = true
source = "community"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/phil/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

[weather]
enabled = false

[widget.active_window]
title_scroll = "on_hover"

[widget.airpods]
type = "harveywuk/airpods:airpods"

[widget.bar]
type = "raycursive/niri-displays:bar"

[widget.clock]
format = "{:%A %F %H:%M:%S}"

[widget.control-center]
glyph = "tool"

[widget.cpu]
visualization = "graph"

[widget.gpu]
stat = "gpu_usage"
type = "sysmon"
visualization = "graph"

[widget.media]
title_scroll = "on_hover"

[widget.network]
show_vpn_label = true
vpn_status = "both"

[widget.network_rx]
visualization = "none"

[widget.network_tx]
visualization = "none"

[widget.privacy]
icon_spacing = 8

[widget.ram]
visualization = "graph"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.sysmon]
stat = "disk_free"
visualization = "none"

[widget.taskbar]
group_by_workspace = true
hide_empty_workspaces = true
show_window_title = true

[widget.tray]
drawer = true
match_adjacent_spacing = true

[widget.vram]
custom_label = "VRAM"
stat = "gpu_vram_used"
type = "sysmon"

[widget.widget]
type = "yocraft/qrcode:widget"

[widget.workspaces]
show_labels = false
